name: Build, Push to ECR and Deploy to EC2

on:
  push:
    branches:
      - master

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build y push de la base de datos MySQL
  # ─────────────────────────────────────────────
  build-db:
    name: Build & Push MySQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen MySQL
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_DB }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./database
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─────────────────────────────────────────────
  # JOB 2: Build y push del backend de Ventas
  # ─────────────────────────────────────────────
  build-ventas:
    name: Build & Push back-Ventas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen back-Ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_VENTAS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─────────────────────────────────────────────
  # JOB 3: Build y push del backend de Despachos
  # ─────────────────────────────────────────────
  build-despachos:
    name: Build & Push back-Despachos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen back-Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_DESPACHOS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─────────────────────────────────────────────
  # JOB 4: Build y push del frontend
  # ─────────────────────────────────────────────
  build-front:
    name: Build & Push front-despacho
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen front-despacho
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_FRONT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./front_despacho
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─────────────────────────────────────────────
  # JOB 5: Deploy en EC2 vía SSM
  # Orden: MySQL → Ventas → Despachos → Frontend
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy en EC2
    runs-on: ubuntu-latest
    needs: [build-db, build-ventas, build-despachos, build-front]
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy en EC2 vía SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO_DB: ${{ secrets.ECR_REPO_DB }}
          ECR_REPO_VENTAS: ${{ secrets.ECR_REPO_VENTAS }}
          ECR_REPO_DESPACHOS: ${{ secrets.ECR_REPO_DESPACHOS }}
          ECR_REPO_FRONT: ${{ secrets.ECR_REPO_FRONT }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME_VENTAS: ${{ secrets.DB_NAME_VENTAS }}
          DB_NAME_DESPACHOS: ${{ secrets.DB_NAME_DESPACHOS }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",

              "docker network create tienda-network 2>/dev/null || true",

              "docker pull '"$ECR_REGISTRY/$ECR_REPO_DB"':latest",
              "docker stop mysql-tienda || true",
              "docker rm mysql-tienda || true",
              "docker run -d --name mysql-tienda --network tienda-network -p 3306:3306 -v mysql-data:/var/lib/mysql -e MYSQL_ROOT_PASSWORD='"$DB_ROOT_PASSWORD"' -e MYSQL_USER='"$DB_USERNAME"' -e MYSQL_PASSWORD='"$DB_PASSWORD"' -e MYSQL_DATABASE='"$DB_NAME_VENTAS"' --restart unless-stopped '"$ECR_REGISTRY/$ECR_REPO_DB"':latest",
              "echo Esperando que MySQL inicie... && sleep 20",

              "docker pull '"$ECR_REGISTRY/$ECR_REPO_VENTAS"':latest",
              "docker stop back-ventas || true",
              "docker rm back-ventas || true",
              "docker run -d --name back-ventas --network tienda-network -p 8080:8080 -e DB_ENDPOINT=mysql-tienda -e DB_PORT=3306 -e DB_NAME='"$DB_NAME_VENTAS"' -e DB_USERNAME='"$DB_USERNAME"' -e DB_PASSWORD='"$DB_PASSWORD"' --restart unless-stopped '"$ECR_REGISTRY/$ECR_REPO_VENTAS"':latest",

              "docker pull '"$ECR_REGISTRY/$ECR_REPO_DESPACHOS"':latest",
              "docker stop back-despachos || true",
              "docker rm back-despachos || true",
              "docker run -d --name back-despachos --network tienda-network -p 8081:8081 -e DB_ENDPOINT=mysql-tienda -e DB_PORT=3306 -e DB_NAME='"$DB_NAME_DESPACHOS"' -e DB_USERNAME='"$DB_USERNAME"' -e DB_PASSWORD='"$DB_PASSWORD"' --restart unless-stopped '"$ECR_REGISTRY/$ECR_REPO_DESPACHOS"':latest",

              "docker pull '"$ECR_REGISTRY/$ECR_REPO_FRONT"':latest",
              "docker stop front-despacho || true",
              "docker rm front-despacho || true",
              "docker run -d --name front-despacho --network tienda-network -p 80:80 --restart unless-stopped '"$ECR_REGISTRY/$ECR_REPO_FRONT"':latest"
            ]' \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          echo "Estado del deploy: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "El deploy falló. Revisa SSM Run Command en la consola de AWS."
            exit 1
          fi
