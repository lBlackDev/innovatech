server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: redirige todo a index.html para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend de Ventas (Spring Boot puerto 8080)
    location /api/v1/ventas {
        proxy_pass http://back-ventas:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy hacia el backend de Despachos (Spring Boot puerto 8081)
    location /api/v1/despachos {
        proxy_pass http://back-despachos:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
